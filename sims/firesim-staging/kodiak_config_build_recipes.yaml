# Build recipes for Kodiak FireSim targets.
# Pass this file to the FireSim manager with -r, e.g.:
#   firesim buildbitstream -r ${CY_DIR}/sims/firesim-staging/kodiak_config_build_recipes.yaml

# Only 10 MHz with the BASIC strategy produces a working Kodiak bitstream on the
# V80 so far. 50 MHz builds (BASIC or RUNTIME_OPTIMIZED) and 10 MHz
# RUNTIME_OPTIMIZED all meet timing but hang or compute wrong results on the
# FPGA.
xilinx_alveo_v80_firesim_kodiak_no_nic_l2_llc4mb_ddr3:
    PLATFORM: xilinx_alveo_v80
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: ../../generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: FireSimKodiakConfig
    PLATFORM_CONFIG: BaseXilinxAlveoV80Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 10
        build_strategy: BASIC
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/xilinx_alveo_v80.yaml
